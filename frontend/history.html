<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Locker | Lịch sử thuê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-page">

  <header class="topbar">
    <div>
      <span class="eyebrow">IoT Smart Locker</span>
      <h1 class="page-title">Lịch sử thuê tủ</h1>
      <p class="page-subtitle">Danh sách các lần thuê tủ của bạn.</p>
    </div>
    <div class="topbar-actions">
      <nav class="nav-tabs-app">
        <a href="dashboard.html">🗄 Tủ khóa</a>
        <a href="history.html" class="active">📋 Lịch sử</a>
      </nav>
      <button id="logoutButton" class="btn-logout">Đăng xuất</button>
    </div>
  </header>

  <main class="content-shell">
    <div class="section-card">
      <div class="section-header">
        <div>
          <div class="section-title">Lịch sử giao dịch</div>
          <div class="section-note">Tất cả các lần thuê tủ của tài khoản bạn.</div>
        </div>
        <span class="badge-count" id="historyCount">0 bản ghi</span>
      </div>

      <div class="history-wrap">
        <table class="history-table">
          <thead>
            <tr>
              <th>Tủ</th>
              <th>Thời gian thuê</th>
              <th>Thời gian trả</th>
              <th>Trạng thái</th>
            </tr>
          </thead>
          <tbody id="historyTableBody">
            <tr><td colspan="4" style="text-align:center;color:var(--muted);padding:32px">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
