<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Locker IoT | Lịch sử thuê</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-page">
  <div class="app-background"></div>

  <header class="topbar">
    <div>
      <span class="eyebrow">IoT Smart Locker</span>
      <h1 class="page-title mb-1">Lịch sử thuê tủ</h1>
      <p class="page-subtitle mb-0">Theo dõi người thuê, số tủ và thời gian phát sinh giao dịch.</p>
    </div>

    <div class="topbar-actions">
      <nav class="nav nav-pills">
        <a class="nav-link" href="dashboard.html">Danh sách tủ</a>
        <a class="nav-link active" href="history.html">Lịch sử</a>
      </nav>
      <button id="logoutButton" class="btn btn-outline-light">Đăng xuất</button>
    </div>
  </header>

  <main class="content-shell">
    <section class="panel-card shadow-lg">
      <div class="section-heading">
        <div>
          <h2 class="section-title">Bảng lịch sử thuê</h2>
          <p class="section-note mb-0">
            Dữ liệu hiện tại đang dùng mock data để mô phỏng backend.
          </p>
        </div>
        <span class="badge rounded-pill text-bg-light" id="historyCount">0 bản ghi</span>
      </div>

      <div class="table-responsive history-table-wrap">
        <table class="table history-table align-middle mb-0">
          <thead>
            <tr>
              <th>Tên người thuê</th>
              <th>Số tủ đã thuê</th>
              <th>Thời gian thuê</th>
            </tr>
          </thead>
          <tbody id="historyTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
