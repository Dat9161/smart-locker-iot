<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Locker | Đăng nhập</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <main class="auth-shell">

    <section class="auth-hero">
      <span class="eyebrow">Smart Locker IoT</span>
      <h1>Hệ thống tủ thông minh</h1>
      <p>Thuê và quản lý tủ từ xa qua giao diện web. Tủ tự động mở bằng ESP32 khi bạn xác nhận.</p>
      <div class="hero-card">
        <div class="hero-stat">
          <strong>2</strong>
          <span>Tủ thông minh</span>
        </div>
        <div class="hero-stat">
          <strong>15s</strong>
          <span>Tự đóng sau</span>
        </div>
        <div class="hero-stat">
          <strong>IoT</strong>
          <span>ESP32 + .NET</span>
        </div>
      </div>
    </section>

    <section class="auth-panel">
      <div class="panel-card">

        <div class="auth-tabs" id="authTabs">
          <button class="active" id="tabLogin">Đăng nhập</button>
          <button id="tabRegister">Đăng ký</button>
        </div>

        <!-- Đăng nhập -->
        <form id="loginForm" novalidate>
          <label class="form-label">Username</label>
          <input class="form-control" type="text" id="loginUsername" placeholder="Nhập username" required>

          <label class="form-label">Mật khẩu</label>
          <input class="form-control" type="password" id="loginPassword" placeholder="Nhập mật khẩu" required>

          <button type="submit" class="btn-primary" id="loginButton">Đăng nhập</button>
          <div id="loginAlert" class="d-none"></div>
        </form>

        <!-- Đăng ký -->
        <form id="registerForm" novalidate class="d-none">
          <label class="form-label">Họ và tên</label>
          <input class="form-control" type="text" id="registerFullName" placeholder="Nhập họ tên" required>

          <label class="form-label">Username</label>
          <input class="form-control" type="text" id="registerUsername" placeholder="Nhập username" required>

          <label class="form-label">Mật khẩu</label>
          <input class="form-control" type="password" id="registerPassword" placeholder="Tối thiểu 6 ký tự" required>

          <button type="submit" class="btn-primary" id="registerButton">Tạo tài khoản</button>
          <div id="registerAlert" class="d-none"></div>
        </form>

      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
