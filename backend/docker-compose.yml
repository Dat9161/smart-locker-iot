version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=SmartLockerDB;User Id=sa;Password=SmartLocker@2024;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartlocker-net
    restart: unless-stopped

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SmartLocker@2024
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SmartLocker@2024" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartlocker-net
    restart: unless-stopped

volumes:
  sqldata:

networks:
  smartlocker-net:
    driver: bridge
