version: '3.8'

# Production compose: bao gồm Nginx reverse proxy
# Sử dụng: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Production: không expose port ra ngoài trực tiếp, chỉ qua nginx
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=SmartLockerDB;User Id=sa;Password=SmartLocker@2024;TrustServerCertificate=True;
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smartlocker-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=SmartLocker@2024
      - MSSQL_PID=Express
    # Production: không expose port SQL Server ra ngoài
    expose:
      - "1433"
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "SmartLocker@2024" -Q "SELECT 1" -No
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - smartlocker-net
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - smartlocker-net
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  sqldata:

networks:
  smartlocker-net:
    driver: bridge
